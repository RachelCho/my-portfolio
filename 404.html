<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 — 조예경 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#f3f1ec; --ink:#161513; --ink-soft:#6b675f; --line:#e6e2d9; --card:#ffffff;
  --pill-bg:#e9e5db; --accent:#161513;
  --content: 1360px; --gut:20px;
  --sp1:5px; --sp2:10px; --sp3:20px; --sp4:30px; --sp5:40px; --sp6:60px; --sp7:80px; --sp8:100px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.shell{max-width:var(--content);margin:0 auto;padding:0 5%;width:100%}

.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;background:var(--pill-bg);color:var(--ink-soft);padding:8px 18px;border-radius:999px;margin-bottom:var(--sp3)}
.card{background:var(--card);border-radius:22px;box-shadow:0 2px 10px rgba(22,21,19,.05);padding:var(--sp5)}

/* ---------- header ---------- */
header.site .shell{display:flex;align-items:center;height:78px}
.logo{font-size:18px;font-weight:800}

/* ---------- 404 ---------- */
main{flex:1;display:flex;align-items:center;padding:var(--sp6) 0 var(--sp7)}
.nf-card{max-width:760px;margin:0 auto;text-align:center;padding:var(--sp8) var(--sp5)}
.nf-card h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.3;margin-bottom:var(--sp3)}
.nf-card p{font-size:15px;color:var(--ink-soft);margin-bottom:var(--sp5)}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:13px 24px;border-radius:999px}
.btn-dark{background:var(--ink);color:#fff}

@media(max-width:600px){
  .nf-card{padding:var(--sp6) var(--sp4)}
}
</style>
</head>
<body>

<header class="site">
  <div class="shell">
    <a href="index.html" class="logo">조예경</a>
  </div>
</header>

<main>
  <div class="shell">
    <div class="card nf-card">
      <span class="pill">404</span>
      <h1>페이지를 찾을 수 없어요</h1>
      <p>주소를 다시 확인해 주세요</p>
      <a href="index.html" class="btn btn-dark">홈으로 가기 →</a>
    </div>
  </div>
</main>

</body>
</html>
