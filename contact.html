<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Rachel Cho</title>
  <style>
    /* 기본 설정 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
    }

    /* 상단 메뉴 */
    nav {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #eeeeee;
    }

    nav .inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      font-weight: 700;
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    nav ul a {
      color: #666666;
      text-decoration: none;
      font-size: 15px;
    }

    nav ul a:hover,
    nav ul a[aria-current="page"] {
      color: #1a1a1a;
    }

    nav ul a[aria-current="page"] {
      font-weight: 600;
    }

    /* 본문 공통 */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    section {
      padding: 72px 0;
      border-bottom: 1px solid #eeeeee;
    }

    section:last-child {
      border-bottom: none;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999999;
      margin-bottom: 24px;
    }

    /* 첫 화면 (이름 + 소개) */
    .hero {
      padding: 120px 0 96px;
    }

    .hero h1 {
      font-size: 48px;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 20px;
      color: #555555;
    }

    /* About */
    .about p {
      font-size: 17px;
      margin-bottom: 16px;
    }

    /* Projects */
    .project-list {
      display: grid;
      gap: 16px;
    }

    .project {
      padding: 24px;
      border: 1px solid #eeeeee;
      border-radius: 12px;
      transition: border-color 0.2s;
    }

    .project:hover {
      border-color: #cccccc;
    }

    .project h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .project p {
      color: #555555;
      font-size: 15px;
    }

    .project .tag {
      display: inline-block;
      margin-top: 12px;
      font-size: 13px;
      color: #888888;
    }

    /* Contact */
    .contact p {
      font-size: 17px;
      margin-bottom: 16px;
    }

    .contact ul {
      list-style: none;
    }

    .contact li {
      margin-bottom: 8px;
    }

    footer {
      text-align: center;
      padding: 40px 24px;
      font-size: 13px;
      color: #999999;
    }

    /* 휴대폰처럼 좁은 화면 */
    @media (max-width: 600px) {
      nav .inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 12px 16px;
      }

      nav ul {
        flex-wrap: wrap;
        gap: 6px 18px;
      }

      main {
        padding: 0 16px;
      }

      .hero {
        padding: 72px 0 56px;
      }

      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 17px;
      }
    }

    /* 하위 페이지 머리말 */
    .page-header {
      padding: 96px 0 48px;
    }

    .page-header h1 {
      font-size: 40px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .page-header p {
      font-size: 18px;
      color: #555555;
    }

    /* 이미지 자리 (사진을 넣기 전 임시 표시) */
    .image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border: 1px dashed #cccccc;
      color: #999999;
      font-size: 14px;
      text-align: center;
      overflow: hidden;
    }

    .image-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-photo {
      width: 160px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      margin-bottom: 32px;
    }

    .project-image {
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .project-list.cards {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }

    @media (max-width: 600px) {
      .page-header {
        padding: 64px 0 32px;
      }

      .page-header h1 {
        font-size: 32px;
      }

      .profile-photo {
        width: 128px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 메뉴 -->
  <nav>
    <div class="inner">
      <a href="index.html" class="logo">Rachel Cho</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="page-header">
      <h1>Contact</h1>
      <p>함께 이야기 나누고 싶다면 편하게 연락해주세요.</p>
    </section>

    <section class="contact">
      <!-- 실제 연락처가 정해지면 아래 안내 문구를 연락처 목록으로 바꾸세요 -->
      <p>연락처 정보는 준비 중입니다.</p>
      <p>곧 이메일과 SNS 링크를 이곳에 추가할 예정이에요.</p>
    </section>
  </main>

  <footer>
    © 2026 Rachel Cho
  </footer>

</body>
</html>
